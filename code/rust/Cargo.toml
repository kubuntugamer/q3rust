[package]
name = "q3rust"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Rust port of the Quake III Arena engine"

[dependencies]
# Vulkan bindings for the renderer. ash loads libvulkan at runtime.
ash = "0.38"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
jpeg-decoder = { version = "0.3", default-features = false }
libc = "0.2"
# Window, Vulkan surface, input and audio device.
sdl2 = { version = "0.38", features = ["use-pkgconfig"] }
